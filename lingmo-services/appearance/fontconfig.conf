<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <match target="pattern">
        <test qual="any" name="family">
            <string>serif</string>
        </test>
        <edit name="family" mode="assign" binding="strong">
            <string>%1</string>
        </edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family">
            <string>sans-serif</string>
        </test>
        <edit name="family" mode="assign" binding="strong">
            <string>%1</string>
        </edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family">
            <string>monospace</string>
        </test>
        <edit name="family" mode="assign" binding="strong">
            <string>%2</string>
            <string>%1</string>
        </edit>
    </match>
    <!-- The family above replaced sans-serif, so the CJK rules keyed on it never fire.
         Text that names its language gets that language's forms. -->
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>zh-tw</string>
        </test>
        <edit name="family" mode="append" binding="strong">
            <string>Noto Sans CJK TC</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>zh-hk</string>
        </test>
        <edit name="family" mode="append" binding="strong">
            <string>Noto Sans CJK HK</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>zh-mo</string>
        </test>
        <edit name="family" mode="append" binding="strong">
            <string>Noto Sans CJK HK</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>zh</string>
        </test>
        <edit name="family" mode="append" binding="strong">
            <string>Noto Sans CJK SC</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>ja</string>
        </test>
        <edit name="family" mode="append" binding="strong">
            <string>Noto Sans CJK JP</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>ko</string>
        </test>
        <edit name="family" mode="append" binding="strong">
            <string>Noto Sans CJK KR</string>
        </edit>
    </match>
    <!-- Chromium and Qt look up a missing glyph without the text's language, so
         without this Han text falls to whichever font covers it first. -->
    <match target="pattern">
        <edit name="family" mode="append" binding="strong">
            <string>%6</string>
        </edit>
    </match>
    <match target="font">
        <edit name="rgba" mode="assign">
            <const>%5</const>
        </edit>
    </match>
    <match target="font">
        <edit name="antialias" mode="assign">
            <bool>%3</bool>
        </edit>
    </match>
    <match target="font">
        <edit name="hintstyle" mode="assign">
            <const>%4</const>
        </edit>
    </match>
</fontconfig>
